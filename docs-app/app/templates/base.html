<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Rēķini un pavadzīmes{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/documents">Rēķini · Pavadzīmes</a>
      <div class="nav-actions">
        <a class="btn btn-secondary" href="/documents/new">Jauns dokuments</a>
        <a class="btn btn-ghost" href="/products">Katalogs</a>
        <form method="post" action="/logout" style="margin:0">
          <button class="btn btn-ghost" type="submit">Iziet</button>
        </form>
      </div>
    </header>
    {% block content %}{% endblock %}
  </div>
  {% endblock %}
  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
