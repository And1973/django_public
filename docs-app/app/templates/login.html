{% extends "base.html" %}
{% block title %}Pieteikšanās — Rēķini un pavadzīmes{% endblock %}
{% block body %}
<div class="login-wrap">
  <div class="panel login-card">
    <h1>Rēķini un pavadzīmes</h1>
    <p class="lead">Ievadiet paroli, lai turpinātu.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack">
      <label>
        Parole
        <input type="password" name="password" required autofocus autocomplete="current-password">
      </label>
      <button class="btn btn-block" type="submit">Ienākt</button>
    </form>
  </div>
</div>
{% endblock %}
