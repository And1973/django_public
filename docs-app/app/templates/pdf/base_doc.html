<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <style>
    @page { size: A4; margin: 16mm; }
    body {
      font-family: DejaVu Sans, Liberation Sans, Arial, sans-serif;
      font-size: 11px;
      color: #1c2429;
      line-height: 1.35;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 6px;
      letter-spacing: 0.02em;
    }
    .meta { margin-bottom: 14px; color: #445055; }
    .parties {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
    }
    .parties td {
      width: 50%;
      vertical-align: top;
      border: 1px solid #cfc5b4;
      padding: 8px 10px;
      background: #faf7f1;
    }
    .parties .label {
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: #5c6b73;
    }
    table.lines {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }
    table.lines th, table.lines td {
      border: 1px solid #cfc5b4;
      padding: 5px 6px;
      text-align: left;
    }
    table.lines th {
      background: #1f5c4d;
      color: #fff;
      font-size: 10px;
      text-transform: uppercase;
    }
    table.lines td.num { text-align: right; white-space: nowrap; }
    .totals { width: 240px; margin-left: auto; }
    .totals td { padding: 3px 0; }
    .totals .grand td { font-weight: 700; font-size: 13px; border-top: 1px solid #cfc5b4; padding-top: 6px; }
    .notes { margin-top: 12px; color: #445055; }
    .sign { margin-top: 28px; }
  </style>
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
